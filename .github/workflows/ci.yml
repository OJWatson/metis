name: Tests and distribution
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install CPU test environment
        run: |
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[legacy,pandas]" pytest build ruff==0.14.0 ty==0.0.46
      - run: ruff check src tests
      - run: ty check src
      - run: python -m pytest -q
      - name: Build wheel and source distribution
        run: python -m build
      - name: Verify installed wheel outside checkout
        run: |
          python -m pip uninstall -y metis-surrogate
          python -m pip install --no-deps dist/*.whl
          cd /tmp
          python -c "import metis; from metis import load_example; assert load_example().inputs.shape[0] == 500"
          metis demo --steps 10 --output /tmp/metis-wheel-demo
          metis-train training.steps=1 training.batch_size=4 training.eval_every=1 model.model_options.hidden_dim=8 hydra.run.dir=/tmp/metis-wheel-hydra
          python -c "from metis import Surrogate; assert Surrogate.load('/tmp/metis-wheel-hydra/model.pt').model_name == 'mlp'"
      - uses: actions/upload-artifact@v4
        with:
          name: distributions-python-${{ matrix.python }}
          path: dist/*
