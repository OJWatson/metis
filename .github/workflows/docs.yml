name: Documentation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: documentation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.13"
          enable-cache: true
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.10.19"
      - name: Install isolated diagram renderer
        run: quarto install chrome-headless-shell --no-prompt
      - name: Install documentation environment
        run: |
          uv sync --locked --extra docs
          echo "QUARTO_PYTHON=$GITHUB_WORKSPACE/.venv/bin/python" >> "$GITHUB_ENV"
      - name: Execute tutorials and build site
        run: uv run --locked --extra docs python scripts/build_docs.py
      - name: Check documentation links and saved notebook outputs
        run: |
          uv run --locked --extra docs python scripts/check_site_links.py quarto/_site
          uv run --locked --extra docs python scripts/check_tutorial_notebook.py quarto/_site --outputs-only
      - name: Rerun a downloaded notebook in a fresh directory
        run: uv run --locked --extra docs python scripts/check_tutorial_notebook.py quarto/_site/basics/saving-and-loading.ipynb
      - uses: actions/upload-artifact@v4
        with:
          name: executed-notebooks
          path: quarto/_site/**/*.ipynb
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@v4
        with:
          path: quarto/_site
  publish-notebooks:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: published-notebooks
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: executed-notebooks
          path: ${{ runner.temp }}/executed-notebooks
      - name: Publish the notebooks used by Colab
        env:
          NOTEBOOK_SOURCE: ${{ runner.temp }}/executed-notebooks
          NOTEBOOK_CHECKOUT: ${{ runner.temp }}/notebook-branch
        run: |
          python scripts/publish_notebooks.py "$NOTEBOOK_SOURCE" "$NOTEBOOK_CHECKOUT" --revision "$GITHUB_SHA"
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [build, publish-notebooks]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
