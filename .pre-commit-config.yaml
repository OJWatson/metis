repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff correctness checks
        entry: uv run --locked --all-extras ruff check
        language: system
        types: [python]
        files: ^(src/|tests/)
      - id: pytest
        name: pytest
        entry: uv run --locked --all-extras pytest
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-push]
