repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff correctness checks
        entry: uv run ruff check
        language: system
        types: [python]
        files: ^(src/|tests/)
      - id: pytest
        name: pytest
        entry: uv run --extra legacy pytest
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-push]
