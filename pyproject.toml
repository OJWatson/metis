[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "metis-surrogate"
version = "0.2.0"
description = "Train, evaluate and deploy neural surrogates from simulation banks"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.txt"]
requires-python = ">=3.11"
dependencies = [
    "hydra-core>=1.3.2,<1.4",
    "numpy>=2.0,<3",
    "polars>=1.37,<3",
    "torch>=2.10,<3",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.9,<4"]
wandb = ["wandb>=0.25,<1"]
pandas = ["pandas>=2.2,<4", "pyarrow>=18"]
legacy = ["hydra-core>=1.3.2,<1.4", "colorama>=0.4.6", "matplotlib>=3.9,<4", "tqdm>=4.66", "wandb>=0.25,<1"]
docs = ["ipykernel>=6.29", "nbformat>=5.10", "nbclient>=0.10", "matplotlib>=3.9,<4", "seaborn>=0.13.2", "pandas>=2.2,<4", "pyarrow>=18"]

[project.scripts]
metis = "metis.cli:main"
metis-train = "metis.hydra_app:main"

[project.urls]
Repository = "https://github.com/OJWatson/metis"
Documentation = "https://ojwatson.github.io/metis/"
Issues = "https://github.com/OJWatson/metis/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/metis"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/examples", "/benchmarks", "/configs", "/quarto", "/README.md", "/CHANGELOG.md", "/CONTRIBUTING.md", "/ATTRIBUTION.md", "/LICENSE*", "/THIRD_PARTY_NOTICES.txt", "/pyproject.toml", "/uv.lock", "/train.py", "/dataloader.py", "/models"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = ["slow: marks longer numerical tests"]

[dependency-groups]
dev = ["build>=1.2", "pytest>=8.3", "pre-commit>=4", "ruff==0.14.0", "ty==0.0.46"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
