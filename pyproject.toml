[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "metis-surrogate"
version = "0.3.0"
description = "Train, evaluate and deploy neural surrogates from simulation banks"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.txt"]
requires-python = ">=3.11"
dependencies = [
    "hydra-core>=1.3.2,<1.4",
    "numpy>=2.0,<3",
    "polars>=1.37,<3",
    "torch>=2.10,<3",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.9,<4"]
wandb = ["wandb>=0.25,<1"]
pandas = ["pandas>=2.2,<4", "pyarrow>=18"]
docs = ["ipykernel>=6.29", "nbformat>=5.10", "nbclient>=0.10", "matplotlib>=3.9,<4", "seaborn>=0.13.2", "pandas>=2.2,<4", "pyarrow>=18"]

[project.scripts]
metis = "metis.cli:main"
metis-train = "metis.hydra_app:main"

[project.urls]
Repository = "https://github.com/OJWatson/metis"
Documentation = "https://ojwatson.github.io/metis/"
Issues = "https://github.com/OJWatson/metis/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/metis"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/examples", "/benchmarks", "/scripts", "/quarto", "/README.md", "/CHANGELOG.md", "/CONTRIBUTING.md", "/ATTRIBUTION.md", "/LICENSE*", "/THIRD_PARTY_NOTICES.txt", "/pyproject.toml", "/uv.lock"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["slow: marks longer numerical tests"]

[dependency-groups]
dev = ["build>=1.2", "pytest>=8.3", "pre-commit>=4", "ruff==0.14.0", "ty==0.0.46"]

# Keep the development environment usable on a CPU-only workstation.
# Consumers select their own PyTorch source in their research project's config.
[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
